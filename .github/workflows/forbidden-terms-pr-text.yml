name: Forbidden Terms – PR-Text

# Prüft Titel und Beschreibung eines PR auch dann, wenn sie nachträglich geändert werden
# (Ereignis `edited`). Läuft bewusst getrennt von ci.yml, damit eine Textänderung nicht
# die gesamte CI neu startet. Begriffsliste nur im Secret FORBIDDEN_TERMS.

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

jobs:
  pr-text:
    name: Forbidden Terms Guard (PR-Text)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Secret vorhanden
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then
            echo "::error::Secret FORBIDDEN_TERMS ist leer oder fehlt."
            exit 1
          fi
      - name: PR-Titel und -Beschreibung prüfen
        env:
          CI: 'true'
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          scripts/check-forbidden-terms.sh --text "$PR_TITLE" || { echo "PR-Titel: Treffer"; status=1; }
          scripts/check-forbidden-terms.sh --text "$PR_BODY" || { echo "PR-Beschreibung: Treffer"; status=1; }
          exit $status
