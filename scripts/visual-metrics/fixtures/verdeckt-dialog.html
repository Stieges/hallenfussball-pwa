<!doctype html>
<!-- @TA-012 Gegenbeispiel: ein offener Dialog (aria-modal) mit Abdunkelung liegt ueber den Bedienelementen der Seite. Die Seite dahinter wird nicht gemeldet; die Tasten im Dialog sind frei. Erwartung gruen. -->
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>t</title><link rel="stylesheet" href="schrift.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#0f172a;font-family:system-ui,sans-serif;font-size:16px}@media (prefers-color-scheme: dark){body{background:#0b1220;color:#f1f5f9}}h1{margin:0;padding:16px;font-size:24px}main{padding:0 16px}.karten{display:flex;gap:16px;margin-top:460px}button{min-height:56px;min-width:96px;font-size:16px;border:0;border-radius:8px;background:#047857;color:#fff;padding:0 16px}.gelb{background:#facc15;color:#0f172a}.rot{background:#b91c1c}.hinweis{position:fixed;left:8px;right:8px;bottom:8px;height:96px;padding:16px;background:#e2e8f0;color:#0f172a;border-radius:8px;display:flex;align-items:center} .karten{margin-top:24px}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}.dlg{width:100%;background:#fff;color:#0f172a;border-radius:8px;padding:16px}.dlg h2{margin:0 0 8px;font-size:20px}.dlg p{margin:0 0 16px}.dlg button{width:100%}</style></head><body><main><h1>Cockpit</h1><div class="karten"><button class="gelb" data-testid="karte-gelb">Gelb</button><button class="rot" data-testid="karte-rot">Rot</button></div></main><div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Spiel beenden</h2><p>Das Ergebnis wird gespeichert.</p><button data-primary data-testid="dialog-ok">Beenden</button></div></div></body></html>
