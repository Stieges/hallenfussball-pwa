<!doctype html>
<!-- Gegenbeispiel zu display-contents.html: das Huellelement hat display:contents, der Inhalt ist aber wirklich verborgen.
     Erwartung BLOCKED "Ansicht leer" (display:contents darf nichts sichtbar machen, was verborgen ist). -->
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monitor</title><link rel="stylesheet" href="schrift.css"><style>.weg{display:none}</style></head><body><div lang="de" style="display: contents"><main class="weg"><h1>Hallencup Nord</h1></main></div></body></html>
