<!doctype html>
<!-- Haertetest Fehler 1 (Daniel 2026-10-16): Titel "Turnierver-/waltung" im Kopf auf 360 px.
     Ursache nachgebaut: hyphens:auto mit lang=de an der Ueberschrift, Schrift zu gross fuer die Flaeche. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnierverwaltung</title>
<style>
  :root { --bg: #ffffff; --text: #0f172a; --muted: #475569; --primary: #047857; --on-primary: #ffffff; --line: #64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --text: #f1f5f9; --muted: #cbd5e1; --primary: #34d399; --on-primary: #052e1c; --line: #94a3b8; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .ib { width: 44px; height: 44px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  h1 { flex: 1; min-width: 0; margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
  main { padding: 16px; }
  p { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 0 0 16px; }
  .primary { width: 100%; min-height: 56px; border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <button class="ib" aria-label="Zurück">&larr;</button>
  <h1 data-title>Turnierverwaltung</h1>
  <button class="ib" aria-label="Teilen">&#8599;</button>
  <button class="ib" aria-label="Mehr">&#8942;</button>
</header>
<main>
  <p>Hallencup Ost, Samstag, 8 Teams in 2 Gruppen.</p>
  <button class="primary" data-primary>Spielplan öffnen</button>
</main>
</body>
</html>
