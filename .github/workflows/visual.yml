name: Visual Regression

# Bildvergleiche (Task T5, .superpowers/sdd/2026-09-24-testumgebung/task-T5-brief.md) gegen die
# eingecheckten Referenzbilder unter tests/e2e/visual/__screenshots__. Läuft IMMER im offiziellen
# Playwright-Container (playwright.config.ts pinnt exakt dieselbe Version wie @playwright/test,
# siehe package.json), damit Schriften/Rendering nicht zwischen Runner-Ubuntu und Container
# abweichen (Ruling Y).
#
# Eigener Workflow statt Job in ci.yml/e2e-cloud.yml — selbes Muster wie die anderen
# Testumgebung-Workflows (separat beobachtbar/deaktivierbar, siehe e2e-cloud.yml und
# rls-role-matrix.yml). Läuft NICHT in den bestehenden E2E-Projekten mit: playwright.config.ts
# gibt den visual-*-Projekten ein eigenes testDir (tests/e2e/visual) und schließt diesen Ordner
# bei den Breakpoint-/Device-/Cloud-Projekten per testIgnore aus.
#
# Zwei Modi (Ruling Y, Punkt 5):
# - Ohne Label `visual-update` auf dem PR: Vergleichsmodus (--update-snapshots=none). Eine
#   Abweichung macht den Job rot, Report + Differenzbilder gehen als Artefakt hoch.
# - Mit Label `visual-update`: Update-Modus (--update-snapshots=all). Playwright schreibt neue
#   Vorlagen statt sie zu vergleichen (würde für sich genommen grün laufen) und der neue
#   Snapshot-Ordner geht als Artefakt `visual-snapshots` hoch — DANACH beendet sich der Job
#   ABSICHTLICH rot (Ruling AC/Issue #3 aus dem T5-Review, Fixrunde 1): ohne diesen bewussten
#   Fehlschlag würde ein vergessenes, weiter gesetztes Label bei jedem folgenden Push
#   stillschweigend neue Vorlagen schreiben und der Job liefe IMMER grün — eine echte visuelle
#   Regression würde dabei kommentarlos zur neuen Vorlage, nie als roter Vergleichslauf sichtbar.
#   Das Committen der Vorlagen, Herunterladen des Artefakts und Entfernen des Labels macht NICHT
#   dieser Workflow, sondern der Controller (Task-T5-Brief, Ruling Y Punkt 5 UND die Zusatzregel
#   im Auftrag: "Den ersten CI-Lauf mit dem Label visual-update löst der Controller aus.") — nach
#   dem Commit der Vorlagen MUSS ein abschließender grüner Vergleichslauf (Label entfernt) den
#   Endstand bestätigen, bevor der PR gemerged wird (siehe docs/TESTUMGEBUNG.md).
#
# `types: [opened, synchronize, reopened, labeled]` (statt der Defaults ohne `labeled`): reines
# Setzen des Labels auf einen bereits offenen PR löst damit sofort einen Lauf aus, statt einen
# Leer-Commit zu erfordern, damit ein `synchronize`-Event das Label sieht.
#
# Noch KEIN Pflicht-Check (Branch-Protection unverändert), siehe docs/TESTUMGEBUNG.md, Abschnitt
# "CI".

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression (Playwright-Container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: &playwright_container_image mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # Abschluss-Review (final-review.md, M9): EINE Quelle für die Image-Version — der
      # Pin-Check-Schritt unten vergleicht sie gegen die installierte @playwright/test-Version.
      # Der YAML-Alias (*playwright_container_image) übernimmt exakt den String aus
      # `container.image` oben, keine zweite literale Kopie.
      PLAYWRIGHT_CONTAINER_IMAGE: *playwright_container_image

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Kein "Install Playwright browsers"-Schritt: das Container-Image bringt Chromium/Firefox/
      # WebKit exakt passend zur gepinnten Version v1.63.0-noble bereits mit (offizielles
      # Playwright-Docker-Muster) — eine zusätzliche `playwright install` würde nur denselben
      # Stand redundant neu herunterladen. GENAU DESHALB muss die Image-Version zur installierten
      # @playwright/test-Version passen — der nächste Schritt erzwingt das.

      # M9 (final-review.md): Dependabot bumpt `@playwright/test` in package.json wöchentlich,
      # rührt das fest verdrahtete Container-Image (`container.image` oben, auch in
      # `package.json#test:visual`/`test:visual:update` und `docs/TESTUMGEBUNG.md` dokumentiert)
      # dabei NICHT an. Ohne diesen Schritt würde ein Versions-Bump hier lautlos mit
      # abweichenden Browser-Binaries laufen (falsche/keine Regression, nur weil Chromium
      # zwischen installierter Testbibliothek und Container-Image auseinanderläuft) statt sauber
      # rot zu werden.
      - name: Pin-Check — Container-Image passt zur installierten @playwright/test-Version
        run: |
          INSTALLED="$(npx playwright --version | awk '{print $2}')"
          IMAGE_VERSION="$(echo "$PLAYWRIGHT_CONTAINER_IMAGE" | sed -E 's#.*:v([0-9.]+)-.*#\1#')"
          echo "Installiert (@playwright/test): $INSTALLED — Container-Image: $IMAGE_VERSION ($PLAYWRIGHT_CONTAINER_IMAGE)"
          if [ "$INSTALLED" != "$IMAGE_VERSION" ]; then
            echo "::error::Container-Image ($PLAYWRIGHT_CONTAINER_IMAGE) passt NICHT zur installierten @playwright/test-Version ($INSTALLED). Nach einem Dependabot-Bump von @playwright/test: container.image in .github/workflows/visual.yml UND die Version in package.json (test:visual/test:visual:update) UND docs/TESTUMGEBUNG.md im selben PR anheben (final-review.md, M9)." >&2
            exit 1
          fi

      - name: Update-Modus bestimmen (Label `visual-update`)
        id: mode
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'visual-update') }}" = "true" ]; then
            echo "update=all" >> "$GITHUB_OUTPUT"
          else
            echo "update=none" >> "$GITHUB_OUTPUT"
          fi

      # Production-Build statt Dev-Server (CI_E2E_USE_PREVIEW steuert playwright.config.ts,
      # webServer "offline" nutzt dann `vite preview` statt `vite dev`) — dasselbe Muster wie der
      # bestehende e2e-tests-Job in ci.yml. Für Visual-Diffs ist das doppelt wichtig: der echte,
      # minifizierte Produktions-Build ist das, was auch der eingecheckten Vorlage zugrunde liegt.
      - name: Build für Visual-Tests
        run: npm run build

      - name: Visual-Tests ausführen
        run: npx playwright test --project=visual-mobile --project=visual-tablet --project=visual-desktop --update-snapshots=${{ steps.mode.outputs.update }}
        env:
          CI_E2E_USE_PREVIEW: 'true'

      - name: Neue Vorlagen als Artefakt hochladen (nur bei Label `visual-update`)
        if: steps.mode.outputs.update == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/e2e/visual/__screenshots__/
          retention-days: 14

      # Ruling AC (T5-Review, Issue #3, Fixrunde 1): Update-Modus endet BEWUSST rot, obwohl der
      # vorherige "Visual-Tests ausführen"-Schritt für sich genommen grün gelaufen wäre
      # (--update-snapshots=all vergleicht nichts, schreibt nur). Ohne diesen Schritt könnte ein
      # versehentlich stehen gelassenes Label jeden weiteren Push stillschweigend als grün
      # durchwinken, unabhängig von echten visuellen Regressionen. Läuft NUR im Update-Modus --
      # der normale Vergleichsmodus (Label fehlt) wird durch einen echten Playwright-Fehlschlag
      # rot, dafür ist dieser Schritt nicht nötig.
      - name: 'Update-Modus: bewusst rot beenden'
        if: steps.mode.outputs.update == 'all'
        run: |
          echo "::error::Update-Modus – Vorlagen im Artefakt visual-snapshots, Label entfernen und Vorlagen committen"
          exit 1

      - name: Playwright-Report hochladen (bei Abweichung)
        if: failure() && steps.mode.outputs.update == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

      - name: Differenzbilder hochladen (bei Abweichung)
        if: failure() && steps.mode.outputs.update == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-results
          path: test-results/
          retention-days: 7
