<!doctype html>
<!-- Gegenbeispiel B-05: offener modaler Dialog ueber Seitentext. Gemessen wird nur die Dialog-Schicht; Erwartung gruen. -->
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>t</title><link rel="stylesheet" href="schrift.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#0f172a;font-family:system-ui,sans-serif}@media (prefers-color-scheme: dark){body{background:#0b1220;color:#f1f5f9}} main{padding:16px;font-size:16px;line-height:1.5}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5)}.dlg{position:fixed;left:16px;right:16px;top:120px;background:#fff;color:#0f172a;border-radius:8px;padding:16px}@media (prefers-color-scheme: dark){.dlg{background:#1e293b;color:#f1f5f9}}.dlg h2{margin:0 0 8px;font-size:20px}.dlg p{margin:0 0 16px;font-size:16px;line-height:1.5}.dlg button{min-height:56px;width:100%;font-size:18px;border:0;border-radius:8px;background:#047857;color:#fff}</style></head><body><main><h1>Spielplan</h1><p>Spiel 1 FC Nord gegen SV Süd, 10:00 Uhr, Feld 1. Spiel 2 TSV West gegen SC Ost, 10:12 Uhr, Feld 2. Spiel 3 FC Nord gegen TSV West, 10:24 Uhr.</p><p>Spiel 4 SV Süd gegen SC Ost, 10:36 Uhr, Feld 2.</p></main><div class="scrim"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Datenschutz</h2><p>Wir speichern nur, was für das Turnier nötig ist.</p><button data-primary>Verstanden</button></div></body></html>
