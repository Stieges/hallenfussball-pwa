name: Prod Smoke

# Rauchtest gegen die Produktion (Anforderung plattform/2026-10-25_rauchtest-nach-deploy.md, @RT-001 bis @RT-008).
# Anleitung, Aufräumen und Secrets: docs/PROD-RAUCHTEST.md
#
#  - Nach jedem erfolgreichen Vercel-Deploy der Produktion (deployment_status): KURZLAUF, nur lesen (@RT-001, @RT-004).
#  - Einmal täglich (schedule) und von Hand (workflow_dispatch): VOLLLAUF mit Wegwerf-Turnier (@RT-003).
# Fehlen die Secrets PROD_SMOKE_EMAIL / PROD_SMOKE_PASSWORD, wird mit klarer Meldung ÜBERSPRUNGEN (Job grün, @RT-005).
# Nach dem 15.11.2026 wird der Lauf ROT (@RT-007); dann diese Datei abschalten.
# Ablage nach einem Fehlschlag: nur Bilder und error-context.md, nie Spur oder Video (@RT-006); das Repository ist öffentlich.

on:
  deployment_status:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Lauf: voll (Wegwerf-Turnier) oder kurz (nur lesen)'
        required: false
        default: 'voll'
        type: choice
        options: [voll, kurz]
      base_url:
        description: 'Adresse (leer = https://hallenfussball-pwa.vercel.app; nur hallenfussball-pwa*.vercel.app erlaubt)'
        required: false
        default: ''
      expected_sha:
        description: 'Erwarteter Commit (leer = Version nur anzeigen, nicht vergleichen)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  rauchtest:
    name: Rauchtest Produktion
    # Bei deployment_status nur erfolgreiche Produktions-Deploys; Vorschau-Deploys der PRs ignorieren.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
      PROD_SMOKE_BASE_URL: ${{ github.event.inputs.base_url }}
      PROD_SMOKE_EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.deployment.sha }}
      # Deploy = kurz, Zeitplan = voll, von Hand = Auswahl
      PROD_SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event_name == 'schedule' && 'voll' || 'kurz') }}

    steps:
      - name: Frist und Adresse prüfen (zuerst, vor allem anderen)
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261115 ]; then
            echo "::error title=Rauchtest abgelaufen::Rauchtest gegen Produktion abgelaufen (Freigabe bis 15.11.)"
            echo "### Rauchtest gegen Produktion abgelaufen (Freigabe bis 15.11.)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$PROD_SMOKE_BASE_URL" ] && ! printf '%s' "$PROD_SMOKE_BASE_URL" | grep -Eq '^https://hallenfussball-pwa(-[a-z0-9-]+)?\.vercel\.app/?$'; then
            echo "::error title=Adresse nicht erlaubt::Nur hallenfussball-pwa*.vercel.app bekommt Zugangsdaten."
            exit 1
          fi

      - name: Zugangsdaten vorhanden?
        id: secrets
        run: |
          if [ -z "$PROD_SMOKE_EMAIL" ] || [ -z "$PROD_SMOKE_PASSWORD" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rauchtest übersprungen::Die Secrets PROD_SMOKE_EMAIL und PROD_SMOKE_PASSWORD fehlen (Einstellungen > Secrets and variables > Actions). Siehe docs/PROD-RAUCHTEST.md."
            echo "### Rauchtest übersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets \`PROD_SMOKE_EMAIL\` und \`PROD_SMOKE_PASSWORD\` fehlen. Anleitung: \`docs/PROD-RAUCHTEST.md\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (nur wegen des Testcodes)
        if: steps.secrets.outputs.have == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.secrets.outputs.have == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.secrets.outputs.have == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.secrets.outputs.have == 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Rauchtest gegen die Produktion
        if: steps.secrets.outputs.have == 'true'
        run: |
          set -o pipefail
          # Leere Adresse = Vorgabe aus der Config
          if [ -z "$PROD_SMOKE_BASE_URL" ]; then unset PROD_SMOKE_BASE_URL; fi
          npx playwright test -c playwright.prod-smoke.config.ts --project=prod-smoke 2>&1 | tee prod-smoke.log

      - name: Turnier im Zusammenfassungs-Bericht nennen
        if: always() && steps.secrets.outputs.have == 'true'
        run: |
          {
            echo "### Rauchtest ($PROD_SMOKE_MODE)"
            echo "Im Volllauf bleibt das Wegwerf-Turnier stehen (nach dem Anpfiff nicht löschbar); Aufräumen mit \`scripts/prod-smoke-cleanup.sql\`."
            echo '```'
            grep -E "^\[Rauchtest\]" prod-smoke.log || echo "(keine Ausgabe)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ablage auf Zugangsdaten prüfen (Treffer werden entfernt)
        if: failure() && steps.secrets.outputs.have == 'true'
        run: |
          mkdir -p test-results/prod-smoke
          grep -rlF -e "$PROD_SMOKE_PASSWORD" test-results/prod-smoke 2>/dev/null | while read -r datei; do
            echo "::warning::Zugangsdaten in $datei gefunden, Datei entfernt"
            rm -f "$datei"
          done || true

      - name: Bericht hochladen (nur Bilder und Fehlerbeschreibung)
        if: failure() && steps.secrets.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-report
          path: |
            test-results/prod-smoke/**/*.png
            test-results/prod-smoke/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore
