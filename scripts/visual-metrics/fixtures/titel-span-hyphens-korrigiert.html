<!doctype html>
<!-- Gegenbeispiel zu titel-span-hyphens: Titel-span ohne automatische Trennung, Schrift mit clamp(), eine Aktion weniger. -->
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>t</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#0f172a;font-family:system-ui,sans-serif}@media (prefers-color-scheme: dark){body{background:#0b1220;color:#f1f5f9}} header{display:flex;gap:8px;padding:8px 16px}.ib{width:44px;height:44px;flex:none}.ttl{flex:1;min-width:0;font-weight:700;font-size:clamp(18px,5.4vw,30px);line-height:1.2;hyphens:manual}</style></head><body><header><button class="ib" aria-label="a">a</button><span class="ttl">Turnierverwaltung</span><button class="ib" aria-label="b">b</button></header></body></html>
