name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  forbidden-terms:
    name: Forbidden Terms Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for PR commit range)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard fails if the terms list secret is missing
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then
            echo "::error::Secret FORBIDDEN_TERMS ist leer oder fehlt. Ein uebersprungener Check darf nie gruen sein — Job schlaegt fehl." >&2
            exit 1
          fi

      - name: Check working tree
        env:
          CI: 'true'
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: scripts/check-forbidden-terms.sh --tree

      - name: Check PR commit messages
        if: github.event_name == 'pull_request'
        env:
          CI: 'true'
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          status=0
          for sha in $(git log --format=%H "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$sha" > "/tmp/commit-msg-$sha.txt"
            if ! scripts/check-forbidden-terms.sh --message "/tmp/commit-msg-$sha.txt"; then
              echo "commit $sha: Treffer in Commit-Nachricht"
              status=1
            fi
          done
          exit $status

      - name: Check PR title and description
        if: github.event_name == 'pull_request'
        env:
          CI: 'true'
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          status=0
          scripts/check-forbidden-terms.sh --text "$PR_TITLE" || { echo "PR-Titel: Treffer"; status=1; }
          scripts/check-forbidden-terms.sh --text "$PR_BODY" || { echo "PR-Beschreibung: Treffer"; status=1; }
          exit $status

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Design Token Sync
        run: npm run tokens:check

      - name: Check Terminology Sync
        run: npm run terms:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --reporter=verbose

      - name: Coverage report (non-blocking)
        run: npm run test:coverage -- --reporter=dot 2>&1 | tee coverage-summary.txt | tail -40
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-summary.txt
          retention-days: 14

  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Breakpoint-basierte Viewports (Primary)
        project: [mobile-sm, mobile-md, tablet-portrait, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build for E2E tests
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI_E2E_USE_PREVIEW: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
