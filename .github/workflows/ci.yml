name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Design Token Sync
        run: npm run tokens:check

      - name: Check Terminology Sync
        run: npm run terms:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --reporter=verbose

      # Abschluss-Review (final-review.md, M7): der Kommentar in vitest.config.ts kündigt eine
      # echte Untergrenze an ("schützt nur vor Regression unter das heute gemessene Niveau") --
      # `continue-on-error: true` widersprach dem, der Schritt lief immer grün, egal was
      # `test:coverage` (bzw. der darunterliegende `vitest run --coverage`, das die
      # `coverage.thresholds` aus vitest.config.ts auswertet und bei Unterschreitung selbst mit
      # Exit ≠ 0 endet) tatsächlich meldete. Lokal geprüft (final-fix-report.md, C1/I1/I2-Runde):
      # Statements 43.08 %, Branches 35.42 %, Functions 35.63 %, Lines 43.98 % -- alle über den
      # Schwellen (41/34/34/42), Exit 0.
      - name: Coverage report (blockierend, Untergrenze aus vitest.config.ts)
        run: npm run test:coverage -- --reporter=dot 2>&1 | tee coverage-summary.txt | tail -40

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-summary.txt
          retention-days: 14

  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Breakpoint-basierte Viewports (Primary)
        project: [mobile-sm, mobile-md, tablet-portrait, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build for E2E tests
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI_E2E_USE_PREVIEW: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
