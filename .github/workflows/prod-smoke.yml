name: Prod Smoke

# Rauchtest NACH dem Deploy gegen die Produktion (Paket „Testwelle 1 vorbereiten“): Seite in aktueller Version, Anmelden mit
# Testkonto, Wegwerf-Turnier anlegen, Spiel anpfeifen + Tor + abpfeifen, Zuschauer-Link zeigt den Stand.
# Anleitung, Aufräumen und Secrets: docs/PROD-RAUCHTEST.md
#
# Start: nach erfolgreichem Vercel-Deploy der Produktion (deployment_status) oder von Hand (workflow_dispatch).
# Fehlen die Secrets PROD_SMOKE_EMAIL / PROD_SMOKE_PASSWORD, wird der Test mit klarer Meldung ÜBERSPRUNGEN (Job grün).
# Erlaubt nur bis 15.11.2026 (Freigabe für E2E gegen Produktion); danach diese Datei abschalten.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Adresse der Produktion (leer = https://hallenfussball-pwa.vercel.app)'
        required: false
        default: ''
      expected_sha:
        description: 'Erwarteter Commit (leer = Version nur anzeigen, nicht vergleichen)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  rauchtest:
    name: Rauchtest Produktion
    # Bei deployment_status nur erfolgreiche Produktions-Deploys; Vorschau-Deploys der PRs ignorieren.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
      PROD_SMOKE_BASE_URL: ${{ github.event.inputs.base_url }}
      PROD_SMOKE_EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.deployment.sha }}

    steps:
      - name: Zugangsdaten vorhanden?
        id: secrets
        run: |
          if [ -z "$PROD_SMOKE_EMAIL" ] || [ -z "$PROD_SMOKE_PASSWORD" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rauchtest übersprungen::Die Secrets PROD_SMOKE_EMAIL und PROD_SMOKE_PASSWORD fehlen (Einstellungen > Secrets and variables > Actions). Siehe docs/PROD-RAUCHTEST.md."
            echo "### Rauchtest übersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets \`PROD_SMOKE_EMAIL\` und \`PROD_SMOKE_PASSWORD\` fehlen. Anleitung: \`docs/PROD-RAUCHTEST.md\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (der geprüfte Commit, nur wegen des Testcodes)
        if: steps.secrets.outputs.have == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.secrets.outputs.have == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.secrets.outputs.have == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.secrets.outputs.have == 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Rauchtest gegen die Produktion
        if: steps.secrets.outputs.have == 'true'
        run: |
          set -o pipefail
          # Leere Adresse = Vorgabe aus der Config
          if [ -z "$PROD_SMOKE_BASE_URL" ]; then unset PROD_SMOKE_BASE_URL; fi
          npx playwright test -c playwright.prod-smoke.config.ts --project=prod-smoke 2>&1 | tee prod-smoke.log

      - name: Wegwerf-Turnier im Zusammenfassungs-Bericht nennen
        if: always() && steps.secrets.outputs.have == 'true'
        run: |
          {
            echo "### Wegwerf-Turnier des Rauchtests"
            echo "Nach dem ersten Anpfiff kann die App das Turnier nicht löschen; es bleibt stehen und wird mit \`scripts/prod-smoke-cleanup.sql\` entfernt."
            echo '```'
            grep -E "^\[Rauchtest\]" prod-smoke.log || echo "(keine Ausgabe)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-report
          path: test-results/prod-smoke/
          retention-days: 7
          if-no-files-found: ignore
