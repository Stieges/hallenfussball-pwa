<html lang="de"><head><meta charset="utf-8"><title>m</title><link rel="stylesheet" href="schrift.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#0b1220;font-family:system-ui,sans-serif}@media (prefers-color-scheme: dark){html,body{background:#0b1220;color:#fff}} .folie{height:100vh;padding:var(--vm-overscan,0px)}.folie::before{content:"LIVE";position:absolute;top:var(--vm-overscan,0px);right:var(--vm-overscan,0px);font-size:11vh;line-height:1.1;color:#b00}.z{font-size:11vh;line-height:1.1;margin:0}</style></head><body><main class="folie"><h1 class="z">Hallencup</h1></main></body></html>
