name: Append Match Events

# Server-Schreibweg append_match_events + server_time (B3b,
# .superpowers/sdd/2026-09-25-pr-b-schreibweg/task-B3b-brief.md, Abschnitt 3).
# scripts/append-match-events-check.sh spielt Baseline + alle neueren Migrationen in einen eigenen
# Wegwerf-Container supabase/postgres, laesst jede Fixture unter src/core/match/__fixtures__/ durch
# die RPC laufen und prueft Rechte, Idempotenz, Kaskade, Nebenlaeufigkeit, Guard, Umschlag, Zeit und
# Zwischenspeicher. Die beiden Gegenproben beweisen, dass der Check Fehler auch erkennt.
# Pfadfilter wie match-engine-parity.yml.

on:
  pull_request:
    paths:
      - 'src/core/match/**'
      - 'supabase/migrations/**'
      - 'scripts/append-match-events-check.sh'
      - 'scripts/lib/migrations-since-baseline.sh'
      - 'scripts/db_privilege_assertions.sql'
      - '.github/workflows/append-match-events.yml'

permissions:
  contents: read

jobs:
  append-match-events:
    name: append_match_events (Fixtures durch die RPC, Postgres-Wegwerfcontainer)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Schreibweg pruefen
        # Exit 1 bei jeder Abweichung. Container wird per trap entfernt.
        run: bash scripts/append-match-events-check.sh

      - name: Gegenprobe A (ohne B3b-Migration muss jede Kategorie ROT sein)
        run: bash scripts/append-match-events-check.sh --without-migration

      - name: Gegenprobe B (falsche Akteursermittlung muss Fixtures und Rechte ROT machen)
        run: bash scripts/append-match-events-check.sh --gegenprobe
