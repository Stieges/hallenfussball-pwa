name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A-09: der Ratchet vergleicht coverage-floors.json mit dem Hauptzweig (git show origin/main:...)
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Design Token Sync
        run: npm run tokens:check

      - name: Check Terminology Sync
        run: npm run terms:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --reporter=verbose

      # Abschluss-Review (final-review.md, M7): der Kommentar in vitest.config.ts kündigt eine
      # echte Untergrenze an ("schützt nur vor Regression unter das heute gemessene Niveau") --
      # `continue-on-error: true` widersprach dem, der Schritt lief immer grün, egal was
      # `test:coverage` (bzw. der darunterliegende `vitest run --coverage`, das die
      # `coverage.thresholds` aus vitest.config.ts auswertet und bei Unterschreitung selbst mit
      # Exit ≠ 0 endet) tatsächlich meldete. Lokal geprüft (final-fix-report.md, C1/I1/I2-Runde):
      # Statements 43.08 %, Branches 35.42 %, Functions 35.63 %, Lines 43.98 % -- alle über den
      # Schwellen (41/34/34/42), Exit 0.
      # Nach-Review (final-rereview.md, I-N2): Ohne `shell:` nutzt GitHub `bash -e {0}`, also ohne
      # `pipefail` -- der Exit-Code der Pipeline kam dann von `tail`, nicht von `test:coverage`,
      # und der Schritt konnte nie rot werden (belegt per `bash -e -c 'false | tee … | tail -1'`
      # → 0, mit `-o pipefail` → 1). `shell: bash` lässt GitHub den Schritt mit
      # `bash --noprofile --norc -eo pipefail {0}` ausführen, damit macht ein Fehlschlag von
      # `test:coverage` den Schritt trotz `tee`/`tail` tatsächlich rot.
      - name: Coverage report (blockierend, Untergrenze aus vitest.config.ts)
        shell: bash
        run: npm run test:coverage -- --reporter=dot 2>&1 | tee coverage-summary.txt | tail -40

      # A-09 (@TA-002..@TA-005): Untergrenzen je Bereich + Ratchet gegen den Hauptzweig.
      # Wird rot, wenn ein Bereich unter seiner Untergrenze liegt oder eine Untergrenze
      # gegenueber origin/main gesenkt wurde.
      - name: Coverage-Untergrenzen je Bereich und Ratchet (blockierend)
        shell: bash
        run: node scripts/coverage-report.mjs --base origin/main

      # A-09 (@TA-006..@TA-008) + TA-CI (@TA-010): Szenario-Abdeckung blockierend. Rot bei Abweichung von der
      # Soll-Zahl, mehr als 15 Nachweisen aus der Generalprobe oder wenn die Zahl der MVP-Kennungen mit
      # regulaerem Test (kein skip/todo/fails, `:teil` zaehlt nicht) unter den GEMESSENEN Stand von origin/main
      # oder unter tests/meta/szenario-floor.json faellt. PRs gegen develop vergleichen ebenfalls mit main.
      # Job-Summary ueber $GITHUB_STEP_SUMMARY (setzt das Skript selbst).
      - name: Szenario-Abdeckung (blockierend, Ratchet gegen origin/main)
        shell: bash
        run: npm run test:scenarios -- --base origin/main 2>&1 | tee scenario-bericht.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-summary.txt
            scenario-bericht.txt
          retention-days: 14

  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Breakpoint-basierte Viewports (Primary)
        # desktop-webkit (B-17 Fixrunde 2): Desktop Safari, läuft nur die Monitor-Spec (testMatch in playwright.config.ts)
        project: [mobile-sm, mobile-md, tablet-portrait, desktop, desktop-webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build for E2E tests
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI_E2E_USE_PREVIEW: 'true'

      # Haertetest der visuellen Messung (scripts/visual-metrics, Skill visuelle-pruefung): braucht
      # Chromium und baut die App selbst (ohne .env); einmal je CI-Lauf genuegt (Review B-17).
      - name: Haertetest visuelle Messung
        if: matrix.project == 'desktop'
        run: npm run test:visual-metrics

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Service-Worker-Precache pruefen
        run: npm run test:sw-precache

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
